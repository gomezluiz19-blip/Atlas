<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#04060c;font-family:"Inter","SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff}
.stars{position:absolute;inset:0;background:
 radial-gradient(1.2px 1.2px at 8% 20%,#fff9,transparent),radial-gradient(1px 1px at 18% 72%,#fff7,transparent),radial-gradient(1.4px 1.4px at 31% 40%,#fffa,transparent),
 radial-gradient(1px 1px at 44% 12%,#fff8,transparent),radial-gradient(1px 1px at 52% 86%,#fff6,transparent),radial-gradient(1.2px 1.2px at 12% 50%,#fff8,transparent),
 radial-gradient(1px 1px at 38% 92%,#fff7,transparent),radial-gradient(1px 1px at 26% 8%,#fff6,transparent),radial-gradient(1.3px 1.3px at 58% 30%,#fff8,transparent)}
.planet{position:absolute;left:520px;top:210px;width:980px;height:980px;border-radius:50%;
 background:radial-gradient(circle at 50% 50%, #0b1a33 0%, #07101f 55%, #040913 100%);
 box-shadow:inset 18px 22px 40px -6px rgba(120,200,255,.95), inset 40px 50px 90px -20px rgba(40,130,255,.55), 0 0 60px 6px rgba(70,160,255,.35), 0 0 160px 50px rgba(30,100,255,.18)}
.planet svg{position:absolute;inset:0;opacity:.13}
.sun{position:absolute;left:560px;top:250px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,220,.95) 0 3%,rgba(255,214,150,.45) 8%,rgba(255,170,90,.12) 28%,transparent 60%);filter:blur(1px)}
.city{position:absolute;inset:0;border-radius:50%;background:radial-gradient(2px 2px at 40% 30%,#ffd98a,transparent),radial-gradient(1.6px 1.6px at 46% 36%,#ffcf73,transparent),radial-gradient(1.6px 1.6px at 35% 42%,#ffd98a,transparent),radial-gradient(2px 2px at 52% 28%,#ffe2a6,transparent),radial-gradient(1.4px 1.4px at 30% 34%,#ffd98a,transparent),radial-gradient(1.6px 1.6px at 44% 48%,#ffcf73,transparent),radial-gradient(1.4px 1.4px at 58% 40%,#ffd98a,transparent);opacity:.85}
.text{position:absolute;left:84px;top:150px;width:560px}
.mark{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#64d2ff,#0a84ff 60%,#0040a0);box-shadow:0 8px 30px rgba(10,132,255,.5);position:relative;margin-bottom:34px}
.mark:after{content:"";position:absolute;inset:16px 11px;border-top:3.5px solid rgba(255,255,255,.95);border-radius:50%;transform:rotate(-12deg)}
h1{margin:0;font-size:124px;line-height:.9;letter-spacing:-5px;font-weight:800}
p{margin:26px 0 0;font-size:36px;line-height:1.25;color:#c9d6ea;letter-spacing:-.5px}
.row{margin-top:38px;display:flex;gap:12px}
.row span{padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.1);font-size:21px;color:#e6eefb;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
</style></head><body><div class="stars"></div><div class="planet"><svg viewBox="0 0 100 100"><g fill="none" stroke="#8fc6ff" stroke-width=".18"><ellipse cx="50" cy="50" rx="49" ry="12"/><ellipse cx="50" cy="50" rx="49" ry="28"/><ellipse cx="50" cy="50" rx="49" ry="42"/><ellipse cx="50" cy="50" rx="12" ry="49"/><ellipse cx="50" cy="50" rx="28" ry="49"/><ellipse cx="50" cy="50" rx="42" ry="49"/><line x1="1" y1="50" x2="99" y2="50"/><line x1="50" y1="1" x2="50" y2="99"/></g></svg><div class="city"></div></div><div class="sun"></div>
<div class="text"><div class="mark"></div><h1>Atlas</h1><p>The whole Earth, and your own corner of it.</p>
<div class="row"><span>Places</span><span>Lenses</span><span>Time</span><span>People</span></div></div></body></html>
