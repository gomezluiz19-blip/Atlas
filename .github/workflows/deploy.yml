name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships to visitors block a deploy (critical ones; review highs by hand).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # Place pages get canonical links and a sitemap at the site's real address.
          ATLAS_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_TICKETMASTER_KEY: ${{ vars.TICKETMASTER_KEY }}
          VITE_SEATGEEK_CLIENT_ID: ${{ vars.SEATGEEK_CLIENT_ID }}
          VITE_EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          VITE_EVENTBRITE_ORG_ID: ${{ vars.EVENTBRITE_ORG_ID }}
          # The Terreno AI proxy (docs/ai-proxy.md): a URL, not a secret; the API key stays in the proxy.
          VITE_ATLAS_AI_PROXY: ${{ vars.ATLAS_AI_PROXY }}
          VITE_ATLAS_EDGE: ${{ vars.ATLAS_EDGE }}
          VITE_ATLAS_EDGE_KEYS: ${{ vars.ATLAS_EDGE_KEYS }}
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_IMAGERY: ${{ vars.IMAGERY }}
          VITE_ESRI_KEY: ${{ secrets.ESRI_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
