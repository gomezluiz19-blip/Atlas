<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060d1a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* ── Two screens ── */
#globe-screen{position:absolute;inset:0;z-index:1}
#map-screen{position:absolute;inset:0;z-index:1;display:none}
#map-screen.active{display:block}

/* ── Globe SVG ── */
svg#globe{display:block;width:100%;height:100%}
#ov{position:absolute;border-radius:50%;pointer-events:none;z-index:3;display:none}
.sphere{fill:url(#oceanGrad)}
.land{stroke-width:.5;cursor:pointer}
.land:hover{filter:brightness(1.18)}
.land.sel{stroke:#60a5fa!important;stroke-width:2.5!important}
.graticule{fill:none;stroke:rgba(255,255,255,.055);stroke-width:.3}
.border{fill:none;stroke:rgba(0,0,0,.35);stroke-width:.45}

/* ── Map screen header ── */
#map-header{
  position:absolute;top:0;left:0;right:0;z-index:500;
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85) 0%,transparent 100%);
  pointer-events:none;
}
#map-header>*{pointer-events:all}
#back-btn{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  background:rgba(4,8,18,.88);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;
  color:rgba(255,255,255,.85);font-size:12px;cursor:pointer;
  transition:background .12s;white-space:nowrap;
}
#back-btn:hover{background:rgba(255,255,255,.1);color:#fff}
#map-country-name{font-size:15px;font-weight:600;color:#fff}

/* ── Map layer switcher ── */
#map-layers{
  position:absolute;top:14px;right:14px;z-index:500;
  display:flex;flex-direction:column;gap:5px;
}
.ml-btn{
  padding:7px 13px;border-radius:9px;
  background:rgba(4,8,18,.88);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.65);font-size:12px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;
  text-align:left;
}
.ml-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.ml-btn.on{background:rgba(96,165,250,.2);border-color:#60a5fa;color:#93c5fd}

/* ── Globe UI ── */
#sw{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;width:min(420px,86vw)}
#si{width:100%;padding:10px 16px;background:rgba(4,8,18,.92);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.14);border-radius:13px;color:#fff;font-size:14px;
  outline:none;font-family:inherit;box-shadow:0 4px 24px rgba(0,0,0,.55)}
#si::placeholder{color:rgba(255,255,255,.28)}
#si:focus{border-color:rgba(96,165,250,.55)}
#sr{position:absolute;top:calc(100%+5px);left:0;right:0;background:rgba(4,8,18,.97);
  border:1px solid rgba(255,255,255,.11);border-radius:11px;overflow:hidden;
  display:none;z-index:21;box-shadow:0 10px 36px rgba(0,0,0,.65)}
.ri{padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:rgba(255,255,255,.85)}
.ri:last-child{border-bottom:none}
.ri:hover{background:rgba(255,255,255,.07)}
.ri-sub{font-size:11px;color:rgba(255,255,255,.32);margin-top:1px}

#globe-btn{position:absolute;top:14px;right:14px;z-index:20;width:42px;height:42px;
  border-radius:11px;background:rgba(4,8,18,.92);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.7);font-size:19px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
#globe-btn:hover{background:rgba(255,255,255,.1);color:#fff}
#hint{position:absolute;bottom:14px;right:14px;z-index:5;background:rgba(4,8,18,.75);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;
  font-size:11px;color:rgba(255,255,255,.35);pointer-events:none}

/* ── Layers button (OSM style, on globe screen) ── */
#layers-btn{position:absolute;bottom:52px;right:14px;z-index:20;
  width:44px;height:44px;border-radius:8px;background:#fff;
  border:2px solid rgba(0,0,0,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
#layers-btn:hover{background:#f0f0f0}
#layers-btn svg{width:26px;height:26px}

/* ── Layers popup ── */
#layers-pop{position:absolute;bottom:102px;right:14px;z-index:21;
  background:#fff;border:1px solid #ccc;border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);display:none;width:160px;overflow:hidden}
#layers-pop.show{display:block}
.lp-title{padding:8px 12px;font-size:10px;font-weight:700;color:#555;
  background:#f5f5f5;border-bottom:1px solid #ddd;text-transform:uppercase;letter-spacing:.06em}
.lp-item{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid #f0f0f0;font-size:13px;color:#333;transition:background .1s}
.lp-item:last-child{border-bottom:none}
.lp-item:hover{background:#f0f7ff}
.lp-item.on{background:#e8f4ff;color:#1a6bc4;font-weight:500}
.lp-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}

/* ── Info card ── */
#ic{position:absolute;bottom:14px;left:14px;z-index:30;
  width:280px;background:rgba(3,6,18,.96);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:12px 14px;display:none;box-shadow:0 10px 32px rgba(0,0,0,.85)}
#ic-x{position:absolute;top:9px;right:10px;width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.45);font-size:13px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
#ic-x:hover{background:rgba(255,255,255,.15);color:#fff}
#ic-top{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
#ic-flag{font-size:22px;line-height:1;flex-shrink:0}
#ic-name{font-size:14px;font-weight:700;color:#fff}
#ic-sub{font-size:10px;margin-top:2px;display:flex;gap:3px;flex-wrap:wrap}
#ic-sub span{background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);padding:1px 6px;border-radius:20px}
#ic-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:6px}
.st{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  border-radius:7px;padding:5px 4px;text-align:center}
.sl{font-size:7px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.28);margin-bottom:2px}
.sv{font-size:11px;font-weight:600;color:#fff}
#ic-ex{display:flex;flex-direction:column;gap:4px}
.er{background:rgba(255,255,255,.04);border-radius:6px;padding:4px 8px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.el{font-size:7px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.28);flex-shrink:0}
.ev{font-size:10px;font-weight:500;color:rgba(255,255,255,.78);text-align:right}
.er.wide{}

/* Infrastructure legend */
#infra-legend{
  position:absolute;bottom:14px;left:14px;z-index:500;
  background:rgba(3,6,18,.94);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:12px 14px;display:none;min-width:200px;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
}
#infra-legend.visible{display:block}
#infra-legend-title{font-size:11px;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:.04em}
.hl-row{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.75);padding:2px 0}
.hl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#infra-status{margin-top:8px;font-size:10px;color:rgba(255,255,255,.4);font-style:italic;min-height:14px}
#leaflet-map{width:100%;height:100%}
.leaflet-control-zoom a{
  background:rgba(4,8,18,.88)!important;color:rgba(255,255,255,.7)!important;
  border-color:rgba(255,255,255,.15)!important;backdrop-filter:blur(12px)}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.1)!important;color:#fff!important}
.leaflet-control-attribution{
  background:rgba(0,0,0,.5)!important;color:rgba(255,255,255,.4)!important;font-size:9px!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.55)!important}

/* Dark mode — grayscale invert of OSM = clean dark map */
#leaflet-map.mode-dark .leaflet-tile-pane{
  filter:grayscale(1) invert(1) brightness(1.05);
}

/* ── Loading ── */
#loading{position:absolute;inset:0;background:#060d1a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;color:rgba(255,255,255,.55);
  font-size:16px;gap:10px}
#loading p{font-size:13px;color:rgba(255,255,255,.28)}
#err{display:none;text-align:center;margin-top:8px}
#err span{color:#f87171;font-size:14px;display:block;margin-bottom:10px}
#err button{padding:8px 20px;background:#3b82f6;border:none;border-radius:8px;
  color:#fff;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div id="loading">
  <div>&#127758; World Explorer</div>
  <p>Loading map data...</p>
  <div id="err">
    <span>Could not load map data.</span>
    <button onclick="location.reload()">Retry</button>
  </div>
</div>

<!-- SCREEN 1: Globe -->
<div id="globe-screen">
  <svg id="globe"></svg>
  <div id="ov"></div>
  <div id="sw">
    <input id="si" placeholder="Search countries..." autocomplete="off" spellcheck="false">
    <div id="sr"></div>
  </div>
  <button id="globe-btn">&#8853;</button>
  <div id="hint">drag to rotate</div>
  <button id="layers-btn" title="Map layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,2 22,8.5 12,15 2,8.5"/>
      <polyline points="2,12 12,18.5 22,12"/>
      <polyline points="2,15.5 12,22 22,15.5"/>
    </svg>
  </button>
  <div id="layers-pop">
    <div class="lp-title">Map View</div>
    <div class="lp-item" data-mapview="streets">
      <div class="lp-dot" style="background:#c8dca0;border-color:#a0b878"></div>Streets
    </div>
    <div class="lp-item" data-mapview="topo">
      <div class="lp-dot" style="background:linear-gradient(135deg,#2a6b3a,#8ab06a,#c4a35a)"></div>Satellite Terrain
    </div>
    <div class="lp-item" data-mapview="dark">
      <div class="lp-dot" style="background:#1a2030;border-color:#0a0e1a"></div>Dark / Lights
    </div>
    <div class="lp-item" data-mapview="health">
      <div class="lp-dot" style="background:#ef4444;border-color:#b91c1c"></div>Health
    </div>
    <div class="lp-item" data-mapview="supply">
      <div class="lp-dot" style="background:#06b6d4;border-color:#0284a5"></div>Supply Chain
    </div>
    <div class="lp-item" data-mapview="energy">
      <div class="lp-dot" style="background:#fbbf24;border-color:#d97706"></div>Energy
    </div>
  </div>
  <div id="ic">
    <button id="ic-x">&#215;</button>
    <div id="ic-top">
      <div id="ic-flag"></div>
      <div><div id="ic-name"></div><div id="ic-sub"></div></div>
    </div>
    <div id="ic-stats"></div>
    <div id="ic-ex"></div>
  </div>
</div>

<!-- SCREEN 2: Full Leaflet Map -->
<div id="map-screen">
  <div id="leaflet-map"></div>
  <div id="map-header">
    <button id="back-btn">&#8592; Globe</button>
    <span id="map-country-name"></span>
  </div>
  <div id="map-layers">
    <button class="ml-btn on" data-tile="streets">&#128506; Streets</button>
    <button class="ml-btn" data-tile="topo">&#127759; Terrain</button>
    <button class="ml-btn" data-tile="dark">&#127769; Lights</button>
    <button class="ml-btn infra-btn" data-tile="health">&#127973; Health</button>
    <button class="ml-btn infra-btn" data-tile="supply">&#128666; Supply Chain</button>
    <button class="ml-btn infra-btn" data-tile="energy">&#9889; Energy</button>
  </div>

  <!-- Infrastructure legend (shared, populated dynamically) -->
  <div id="infra-legend">
    <div id="infra-legend-title"></div>
    <div id="infra-legend-items"></div>
    <div id="infra-status"></div>
  </div>
</div>

<script>
function loadJS(src, cb) {
  var s = document.createElement('script'); s.src = src;
  s.onload = cb;
  s.onerror = function(){
    document.getElementById('err').style.display = 'block';
    document.querySelector('#loading > div').textContent = 'Could not load map library.';
  };
  document.head.appendChild(s);
}

// Wait for Leaflet (from <head>), then load D3/TopoJSON
(function waitReady(){
  if (window.L && !window.d3) {
    loadJS('https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js', function(){
      loadJS('https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js', startApp);
    });
  } else if (window.L && window.d3 && window.topojson) {
    startApp();
  } else {
    setTimeout(waitReady, 40);
  }
})();

function fmt(n){
  if(!n&&n!==0)return'--';
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return Math.round(n/1e3)+'K';
  return n.toLocaleString();
}

      if(am==='pharmacy'||hc==='pharmacy') return 'pharmacy';

      var ind=(tags.industrial||'').toLowerCase();
      var am=(tags.amenity||'').toLowerCase();

        if(nm.match(/hydro|dam|falls/)||gs==='hydro') return 'hydro';

        if(gs.match(/solar/)) return 'solar';
        if(gs.match(/wind/)) return 'wind';

function makeInfraIcon(type, mode) {
  var cfg = INFRA[mode].types[type] || INFRA[mode].types.other;
  var r = cfg.r;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(r*2+4)+'" height="'+(r*2+4)+'">'
    + '<circle cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+r+'" fill="'+cfg.color+'" fill-opacity=".92" stroke="#fff" stroke-width="1.5"/>'
    + '</svg>';
  return L.divIcon({
    html:svg, className:'',
    iconSize:[r*2+4,r*2+4], iconAnchor:[r+2,r+2], popupAnchor:[0,-(r+4)]
  });
}

function clearInfraMarkers() {
  infraMarkers.forEach(function(m){ if(leafMap) leafMap.removeLayer(m); });
  infraMarkers = [];
}

function showInfraLegend(mode) {
  var cfg = INFRA[mode];
  document.getElementById('infra-legend-title').innerHTML = cfg.title;
  document.getElementById('infra-legend-items').innerHTML = Object.entries(cfg.types).map(function(e){
    return '<div class="hl-row"><span class="hl-dot" style="background:'+e[1].color+'"></span>'+e[1].label+'</div>';
  }).join('');
  document.getElementById('infra-status').textContent = '';
  document.getElementById('infra-legend').classList.add('visible');
}

function renderInfraPoints(points, mode) {
  var cfg = INFRA[mode];
  var count = 0;
  points.forEach(function(pt) {
    var type = pt.type || 'other';
    var typeCfg = cfg.types[type] || cfg.types.other;
    var marker = L.marker([pt.lat, pt.lon], {icon: makeInfraIcon(type, mode)});
    var pop = '<div style="font:13px/1.5 system-ui,sans-serif;max-width:240px;padding:2px">'
      + '<b style="font-size:13px">'+pt.name+'</b>'
      + '<div style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:10px;'
      + 'background:'+typeCfg.color+'22;color:'+typeCfg.color+';font-size:10px;font-weight:600">'+typeCfg.label+'</div>'
      + (pt.operator ? '<div style="color:#888;font-size:11px;margin-top:2px">'+pt.operator+'</div>' : '')
      + (pt.note ? '<div style="color:#999;font-size:11px;margin-top:1px;font-style:italic">'+pt.note+'</div>' : '')
      + '</div>';
    marker.bindPopup(pop, {maxWidth:260});
    marker.addTo(leafMap);
    infraMarkers.push(marker);
    count++;
  });
  var status = document.getElementById('infra-status');
  if (status) status.textContent = count + ' assets';
}

function loadInfraData(code, mode) {
  var c = C[code]; if (!c) return;
  currentInfraMode = mode;
  clearInfraMarkers();
  var status = document.getElementById('infra-status');

  // Use embedded static data if available — always works from file://
  if (STATIC_INFRA[code] && STATIC_INFRA[code][mode]) {
    renderInfraPoints(STATIC_INFRA[code][mode], mode);
    return;
  }

  // Fall back to live Overpass API (works when served over HTTP)
  if (!c.b) { status.textContent = 'No bounds for this country'; return; }
  status.textContent = 'Loading\u2026';
  var b = c.b;
  var s=b[0][0], w=b[0][1], n=b[1][0], e=b[1][1];
  var maxSpan = 20;
  if ((n-s)>maxSpan||(e-w)>maxSpan) {
    var mLat=(n+s)/2,mLng=(e+w)/2,half=maxSpan/2;
    s=mLat-half;n=mLat+half;w=mLng-half;e=mLng+half;
  }
  var bbox=s+','+w+','+n+','+e;
  var query=INFRA[mode].query(bbox);
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query),true);
  xhr.timeout=28000;
  xhr.onload=function(){
    if(xhr.status!==200){status.textContent='Server error';return;}
    if(currentInfraMode!==mode)return;
    try {
      var els=(JSON.parse(xhr.responseText).elements)||[];
      var seen={},pts=[];
      els.forEach(function(el){
        if(seen[el.id])return;seen[el.id]=true;
        var lat=el.lat||(el.center&&el.center.lat);
        var lon=el.lon||(el.center&&el.center.lon);
        if(!lat||!lon||!((el.tags||{}).name))return;
        pts.push({name:el.tags.name,type:INFRA[mode].classify(el.tags),lat:lat,lon:lon,
          operator:el.tags.operator,note:el.tags.description});
      });
      renderInfraPoints(pts.slice(0,400),mode);
    } catch(ex){status.textContent='Error loading data';}
  };
  xhr.ontimeout=function(){status.textContent='Timed out';};
  xhr.onerror=function(){status.textContent='Run from a local server for live data';};
  xhr.send();
}

function addCityLights(bounds) {
  lightMarkers.forEach(function(m){ leafMap.removeLayer(m); });

  CITY_LIGHTS.forEach(function(city){
    if (bounds && !bounds.contains([city.lat, city.lng])) return;

          + 'background:radial-gradient(circle,rgba(255,240,180,0.9) 0%,rgba(255,200,80,0.4) 40%,transparent 70%);'
          + 'filter:blur(2px)"></div>',

      iconAnchor: [r, r]

    m.addTo(leafMap);

function initLeafMap(){
  if(leafMap) return;
  leafMap = L.map('leaflet-map',{
    zoomControl:true,
    attributionControl:true,
    minZoom:2,maxZoom:19
  });
}

function setTiles(key){
  if(!leafMap) return;
  clearInfraMarkers();
  clearCityLights();
  document.getElementById('infra-legend').classList.remove('visible');
  leafTiles.forEach(function(l){leafMap.removeLayer(l);});
  leafTiles=[];

  var src = TILE_SOURCES[key] || TILE_SOURCES.streets;
  var tilePane = leafMap.getPanes().tilePane;
  var mapEl = document.getElementById('leaflet-map');

  if (src.darkMode) {
    mapEl.classList.add('mode-dark');
    if (tilePane) tilePane.style.filter = '';
  } else {
    mapEl.classList.remove('mode-dark');
    if (tilePane) tilePane.style.filter = src.filter || '';
  }

  src.layers.forEach(function(t){
    var l = L.tileLayer(t.url, t.opt);
    l.addTo(leafMap);
    leafTiles.push(l);
  });

  document.querySelectorAll('.ml-btn').forEach(function(b){
    b.classList.toggle('on', b.dataset.tile===key);
  });

  // Handle infrastructure overlay modes
  var infraMode = (key==='health'||key==='supply'||key==='energy') ? key : null;
  if (infraMode && selCode) {
    showInfraLegend(infraMode);
    loadInfraData(selCode, infraMode);
  }

  if (key === 'dark') addCityLights(null);

  if (typeof MAPVIEW_GLOBE !== 'undefined') {
    applyGlobeStyle(MAPVIEW_GLOBE[key] || 'biome');
  }
}

function openMapView(code, tileKey){
  var c=C[code]; if(!c) return;
  initLeafMap();
  document.getElementById('map-screen').classList.add('active');
  document.getElementById('map-country-name').innerHTML=c.f+' '+c.n;
  if(tileKey === 'dark'){
    // World view so all city lights are visible
    leafMap.setView([20, 0], 2, {animate:false});
  } else if(c.b){
    leafMap.fitBounds(c.b,{padding:[60,80],maxZoom:9,animate:false});
  } else {
    leafMap.setView([c.lat,c.lng],5,{animate:false});
  }
  leafMap.invalidateSize();
  setTiles(tileKey||'streets');
}

function closeMapView(){
  document.getElementById('map-screen').classList.remove('active');
  document.getElementById('leaflet-map').classList.remove('mode-dark');
  document.getElementById('leaflet-map').style.filter = '';
  if (leafMap) {
    var tp = leafMap.getPanes().tilePane;
    if (tp) tp.style.filter = '';
  }
  clearInfraMarkers();
  clearCityLights();
  currentInfraMode = null;
  document.getElementById('infra-legend').classList.remove('visible');
  applyGlobeStyle('biome');
}

document.getElementById('back-btn').addEventListener('click',closeMapView);

document.querySelectorAll('.ml-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    setTiles(this.dataset.tile);
  });
});

var W=window.innerWidth, H=window.innerHeight;
var svg=d3.select('#globe').attr('width',W).attr('height',H);
var defs=svg.append('defs');

var og=defs.append('radialGradient').attr('id','oceanGrad').attr('cx','40%').attr('cy','38%').attr('r','65%');
og.append('stop').attr('offset','0%').attr('stop-color','#1a5276');
og.append('stop').attr('offset','55%').attr('stop-color','#0e3460');
og.append('stop').attr('offset','100%').attr('stop-color','#060e20');
defs.append('clipPath').attr('id','sc').append('path');

var g=svg.append('g');
var gS=g.append('g'), gG=g.append('g');
var gL=g.append('g').attr('clip-path','url(#sc)');
var gB=g.append('g').attr('clip-path','url(#sc)');
var gT=g.append('g').attr('clip-path','url(#sc)');

var isGlobe=true, rot=[0,0], geoC, geoBrd;
var baseScale=Math.min(W,H)*0.42, currentScale=baseScale;
var globeStyle='biome';

function makeProj(){
  return isGlobe
    ?d3.geoOrthographic().scale(currentScale).translate([W/2,H/2]).clipAngle(90).rotate(rot)
    :d3.geoNaturalEarth1().scale(W/6.2).translate([W/2,H/2]);
}
var proj=makeProj(), pg=d3.geoPath().projection(proj);

function posOv(){
  var s=GLOBE_STYLES[globeStyle];
  if(!s||!s.ov||!isGlobe){document.getElementById('ov').style.display='none';return;}
  var r=currentScale,ov=document.getElementById('ov');
  Object.assign(ov.style,{
    width:r*2+'px',height:r*2+'px',left:(W/2-r)+'px',top:(H/2-r)+'px',
    background:['radial-gradient(ellipse 48% 42% at 30% 26%,rgba(255,255,255,.1) 0%,transparent 65%)',
      'radial-gradient(ellipse 65% 62% at 72% 68%,rgba(0,0,0,.72) 0%,rgba(0,0,0,.26) 48%,transparent 70%)'].join(','),
    boxShadow:'0 0 0 3px rgba(8,24,70,.7),0 0 60px 12px rgba(8,16,52,.8)'
  });
  ov.style.display='block';
}

function applyGlobeStyle(style){
  globeStyle=style;
  var s=GLOBE_STYLES[style]||GLOBE_STYLES.biome;
  gS.select('path').attr('fill',s.ocean);
  gG.select('path').attr('stroke',s.grat);
  gL.selectAll('path').each(function(d){
    var code=NUM[String(d.id).padStart(3,'0')];
    var fill=s.colors[BIOME[code]||'def']||s.colors.def;
    d3.select(this)
      .attr('fill',fill)
      .attr('stroke',code===selCode?'#60a5fa':d3.color(fill).darker(.7).formatHex())
      .attr('stroke-width',code===selCode?2.5:0.5);
  });
  document.querySelectorAll('.lp-item').forEach(function(i){
    i.classList.toggle('on',i.dataset.style===style);
  });
  posOv();
}

function redraw(){
  proj=makeProj(); pg=d3.geoPath().projection(proj);
  defs.select('#sc path').attr('d',pg({type:'Sphere'}));
  gS.select('path').attr('d',pg({type:'Sphere'}));
  gG.select('path').attr('d',pg(d3.geoGraticule()()));
  gL.selectAll('path').attr('d',pg);
  gB.select('path').attr('d',pg(geoBrd));
  gT.selectAll('text').each(function(d){
    var c=pg.centroid(d);
    d3.select(this).attr('x',isNaN(c[0])?-9999:c[0]).attr('y',isNaN(c[1])?-9999:c[1]);
  });
}

function buildGlobe(topo){
  geoC=topojson.feature(topo,topo.objects.countries);
  geoBrd=topojson.mesh(topo,topo.objects.countries,function(a,b){return a!==b;});
  defs.select('#sc path').attr('d',pg({type:'Sphere'}));
  gS.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d',pg);
  gG.append('path').datum(d3.geoGraticule()()).attr('class','graticule').attr('d',pg);
  gL.selectAll('path').data(geoC.features).join('path')
    .attr('class','land').attr('d',pg)
    .each(function(d){
      var code=NUM[String(d.id).padStart(3,'0')];
      var s=GLOBE_STYLES.biome;
      var fill=s.colors[BIOME[code]||'def']||s.colors.def;
      d3.select(this).attr('fill',fill).attr('stroke',d3.color(fill).darker(.7).formatHex()).attr('stroke-width',.5);
    })
    .on('click',function(_,d){
      var code=NUM[String(d.id).padStart(3,'0')];
      if(!code||!C[code]) return;
      selCode=code;
      applyGlobeStyle(globeStyle);
      zoomTo(C[code]);
      showCard(code);
    });
  gB.append('path').datum(geoBrd).attr('class','border').attr('d',pg);
  gT.selectAll('text').data(geoC.features.filter(function(d){
    var code=NUM[String(d.id).padStart(3,'0')];
    return code&&C[code]&&C[code].a>300000;
  })).join('text')
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('font-size','5.5px').attr('fill','rgba(255,255,255,.68)')
    .attr('stroke','rgba(0,0,0,.5)').attr('stroke-width','.8').attr('paint-order','stroke')
    .attr('pointer-events','none')
    .each(function(d){
      var c=pg.centroid(d),code=NUM[String(d.id).padStart(3,'0')];
      d3.select(this).attr('x',isNaN(c[0])?-9999:c[0]).attr('y',isNaN(c[1])?-9999:c[1])
        .text(C[code]?C[code].n:'');
    });
  posOv();
  document.getElementById('ov').style.display='block';
  document.getElementById('loading').style.display='none';
  setupControls();
}

function zoomTo(c){
  var tRot=[-c.lng,-c.lat],sRot=[rot[0],rot[1]],sSc=currentScale;
  var area=c.a||500000;
  var tSc=baseScale*Math.max(0.9,Math.min(2.8,160/Math.sqrt(area/40000)));
  var steps=45,step=0;
  function ease(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
  (function tick(){
    step++;var t=ease(Math.min(step/steps,1));
    rot[0]=sRot[0]+(tRot[0]-sRot[0])*t;
    rot[1]=sRot[1]+(tRot[1]-sRot[1])*t;
    currentScale=sSc+(tSc-sSc)*t;
    redraw();posOv();
    if(step<steps)requestAnimationFrame(tick);
  })();
}

var zoomB;
function setupControls(){
  zoomB=d3.zoom().scaleExtent([.8,50]).filter(function(){return !isGlobe;})
    .on('zoom',function(e){
      g.attr('transform',e.transform);
      gT.selectAll('text').attr('font-size',Math.max(1.5,Math.min(11,5.5/e.transform.k))+'px');
    });
  svg.call(zoomB);
  var drag=false,lx=0,ly=0;
  svg.on('mousedown.gd touchstart.gd',function(e){
    if(!isGlobe)return;drag=true;
    var p=e.touches?e.touches[0]:e;lx=p.clientX;ly=p.clientY;e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!drag||!isGlobe)return;
    rot[0]+=(e.clientX-lx)*.35;rot[1]-=(e.clientY-ly)*.35;
    rot[1]=Math.max(-85,Math.min(85,rot[1]));lx=e.clientX;ly=e.clientY;redraw();
  });
  window.addEventListener('touchmove',function(e){
    if(!drag||!isGlobe)return;
    rot[0]+=(e.touches[0].clientX-lx)*.35;rot[1]-=(e.touches[0].clientY-ly)*.35;
    rot[1]=Math.max(-85,Math.min(85,rot[1]));
    lx=e.touches[0].clientX;ly=e.touches[0].clientY;redraw();
  });
  window.addEventListener('mouseup',function(){drag=false;});
  window.addEventListener('touchend',function(){drag=false;});
  document.getElementById('globe-btn').addEventListener('click',function(){
    isGlobe=!isGlobe;
    this.innerHTML=isGlobe?'&#8853;':'&#8862;';
    document.getElementById('hint').textContent=isGlobe?'drag to rotate':'scroll to zoom';
    g.attr('transform',null);currentScale=baseScale;redraw();posOv();
  });
}

// ══════════════════════════════════
// INFO CARD
// ══════════════════════════════════
function showCard(code){
  var c=C[code];if(!c)return;
  var ex=EXTRA[code]||{};
  document.getElementById('ic-flag').innerHTML=c.f;
  document.getElementById('ic-name').textContent=c.n;
  var pills=[c.r,'Capital: '+c.c];
  if(ex.lang)pills.push(ex.lang);
  if(ex.cur)pills.push(ex.cur);
  document.getElementById('ic-sub').innerHTML=pills.map(function(p){return'<span>'+p+'</span>';}).join('');
  var d=c.a>0?Math.round(c.p/c.a):0;
  document.getElementById('ic-stats').innerHTML=
    [['Population',fmt(c.p)],['Area',fmt(c.a)+' km²'],['Density',fmt(d)+'/km²'],['GDP/cap','$'+fmt(c.g)]]
    .map(function(s){return'<div class="st"><div class="sl">'+s[0]+'</div><div class="sv">'+s[1]+'</div></div>';}).join('');
  var rows=[];
  if(ex.drive)rows.push(['Drives on',ex.drive]);
  if(ex.un)rows.push(['UN since',ex.un]);
  var h=rows.map(function(r){return'<div class="er"><span class="el">'+r[0]+'</span><span class="ev">'+r[1]+'</span></div>';}).join('');
  if(ex.fact)h+='<div class="er wide"><span class="el">Did you know</span><span class="ev">'+ex.fact+'</span></div>';
  document.getElementById('ic-ex').innerHTML=h;
  document.getElementById('ic').style.display='block';
}

document.getElementById('ic-x').addEventListener('click',function(){
  document.getElementById('ic').style.display='none';
  selCode=null;applyGlobeStyle(globeStyle);
});


// ══════════════════════════════════
// GLOBE STYLE SWITCHER
// ══════════════════════════════════
document.getElementById('layers-btn').addEventListener('click',function(e){
  e.stopPropagation();
  document.getElementById('layers-pop').classList.toggle('show');
});
document.addEventListener('click',function(e){
  if(!document.getElementById('layers-pop').contains(e.target)&&
     e.target!==document.getElementById('layers-btn'))
    document.getElementById('layers-pop').classList.remove('show');
});
// Map view → globe style mapping
var MAPVIEW_GLOBE = {
  streets: 'biome',
  topo:    'topo',
  dark:    'dark',
  health:  'biome',
  supply:  'plain',
  energy:  'dark'
};

document.querySelectorAll('.lp-item[data-mapview]').forEach(function(item){
  item.addEventListener('click',function(){
    document.getElementById('layers-pop').classList.remove('show');
    var mv = this.dataset.mapview;
    // Change globe to match the selected view
    applyGlobeStyle(MAPVIEW_GLOBE[mv] || 'biome');
    if(selCode) openMapView(selCode, mv);
  });
});

// ══════════════════════════════════
// SEARCH
// ══════════════════════════════════
var allC=Object.entries(C).map(function(e){return Object.assign({code:e[0]},e[1]);});
var inp=document.getElementById('si'),res=document.getElementById('sr');
inp.addEventListener('input',function(){
  var q=inp.value.toLowerCase().trim();
  if(!q){res.style.display='none';return;}
  var hits=allC.filter(function(c){return c.n.toLowerCase().includes(q)||c.c.toLowerCase().includes(q);}).slice(0,8);
  if(!hits.length){res.style.display='none';return;}
  res.innerHTML=hits.map(function(c){
    return'<div class="ri" data-code="'+c.code+'"><span style="font-size:16px">'+c.f+'</span>'
          +'<div><div>'+c.n+'</div><div class="ri-sub">'+c.c+' &mdash; '+c.r+'</div></div></div>';
  }).join('');
  res.style.display='block';
});
res.addEventListener('click',function(e){
  var item=e.target.closest('.ri');if(!item)return;
  res.style.display='none';inp.value='';
  var code=item.dataset.code,c=C[code];if(!c)return;
  selCode=code;applyGlobeStyle(globeStyle);
  zoomTo(c);showCard(code);
});
document.addEventListener('click',function(e){
  if(!res.contains(e.target)&&e.target!==inp)res.style.display='none';
});

// ══════════════════════════════════
// FETCH & START
// ══════════════════════════════════
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(function(r){if(!r.ok)throw r;return r.json();})
  .then(buildGlobe)
  .catch(function(){
    document.getElementById('err').style.display='block';
    document.querySelector('#loading > div').textContent='Could not load map data.';
    document.querySelector('#loading p').style.display='none';
  });

} // end startApp
</script>
